<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A little surprise 💌</title>
<style>
:root{--bg1:#fff1f3;--bg2:#ffc2d1;--ink:#4a1f2e;--soft:#8a4b5f;--card:#fffffff0;--accent:#d81e5b;--accent2:#ff8fab;--glow:#d81e5b55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#150610;--bg2:#4a0f2c;--ink:#ffeaf0;--soft:#f0aac0;--card:#2a0f20f2;--accent:#ff4f86;--accent2:#ff8fab;--glow:#ff4f8677}}
:root[data-theme="dark"]{--bg1:#150610;--bg2:#4a0f2c;--ink:#ffeaf0;--soft:#f0aac0;--card:#2a0f20f2;--accent:#ff4f86;--accent2:#ff8fab;--glow:#ff4f8677}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 15%,var(--bg2),var(--bg1) 72%) fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;text-align:center}
h1,h2{font-weight:normal;margin:0}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;box-sizing:border-box}
.hidden{display:none!important}
.big{font-size:clamp(2.1rem,8vw,3.5rem);line-height:1.1}
.big b{color:var(--accent);font-weight:normal;font-style:italic}
.sub{color:var(--soft);font-style:italic;max-width:30rem;margin:0}
button.go,a.go{font:inherit;font-size:1.1rem;padding:13px 30px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 24px var(--glow);text-decoration:none;display:inline-block}
button.go:active{transform:scale(.96)}
a.alt{background:transparent;color:var(--ink);border:2px solid var(--accent2);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pol{display:flex;justify-content:center;margin:6px 0}
.pol img{width:clamp(80px,26vw,130px);height:clamp(100px,32vw,165px);object-fit:cover;border:6px solid #fff;border-bottom-width:20px;border-radius:4px;box-shadow:0 8px 24px #0006;margin:0 -8px;transform:rotate(-8deg);animation:sway 4s ease-in-out infinite}
.pol img:nth-child(2){transform:rotate(3deg) translateY(-10px);z-index:2;animation-delay:-1.5s}
.pol img:nth-child(3){transform:rotate(9deg);animation-delay:-3s}
@keyframes sway{50%{translate:0 -6px}}
.pulse{font-size:3rem;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(32rem,100%)}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.h{aspect-ratio:1;border:0;background:none;font-size:clamp(2.4rem,11vw,3.6rem);cursor:pointer;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--glow));transition:transform .2s}
.h:nth-child(odd){animation-delay:-1.4s}.h:nth-child(3n){animation-delay:-.7s}
.h:hover{transform:scale(1.15)}
.h.open{filter:grayscale(.5) opacity(.5);animation:none}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
.count{color:var(--soft)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:auto}
.card{background:var(--card);border:2px solid var(--accent2);border-radius:24px;padding:26px 22px;max-width:23rem;box-shadow:0 10px 50px var(--glow);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card .em{font-size:2.6rem}.card p{font-size:1.2rem;line-height:1.5;margin:10px 0 18px}
.card img{max-width:100%;max-height:42vh;border-radius:14px;margin-top:8px;border:4px solid #fff}
.fall{position:fixed;top:-2rem;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

.lockbox{display:flex;flex-direction:column;align-items:center;gap:14px}
.lockbox input{font:inherit;padding:12px 18px;border-radius:999px;border:2px solid var(--accent2);background:var(--card);color:var(--ink);width:min(18rem,80vw);text-align:center}
.err{color:var(--accent);min-height:1.4em;margin:0}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="lock" class="screen">
  <div class="pulse">🔒</div>
  <h1 class="big">A little surprise is <b>waiting</b> 💌</h1>
  <p class="sub">Type the secret password to open it.</p>
  <div class="lockbox">
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
    <button class="go" id="open">Unlock 💗</button>
    <p class="err" id="err"></p>
  </div>
</div>
<div id="app"></div>

function bytes(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
